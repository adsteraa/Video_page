<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>खास वीडियो</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0b0b12;
      font-family: Arial, sans-serif;
      color: #fff;
      padding: 12px;
    }

    .page {
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
    }

    .card {
      width: 100%;
      overflow: hidden;
      border-radius: 18px;
      background: #171722;
      box-shadow: 0 8px 30px rgba(0,0,0,.4);
    }

    /* Image ko crop nahi karega */
    .poster {
      display: block;
      width: 100%;
      height: auto;
      max-width: 100%;
    }

    .content {
      padding: 24px 18px 28px;
      text-align: center;
    }

    .title {
      font-size: 24px;
      line-height: 1.45;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .title span {
      display: block;
      color: #ff68ad;
      margin-top: 5px;
    }

    .button {
      display: block;
      width: 100%;
      padding: 16px 20px;
      border-radius: 50px;
      background: linear-gradient(135deg, #ff4b9a, #d92778);
      color: #fff;
      text-decoration: none;
      text-align: center;
      font-size: 18px;
      font-weight: 700;
      box-shadow: 0 6px 20px rgba(255,75,154,.25);
    }

    .button:active {
      transform: scale(.98);
    }

    .note {
      margin-top: 15px;
      color: #aaa;
      font-size: 12px;
      line-height: 1.5;
    }

    @media (max-width: 380px) {
      body {
        padding: 8px;
      }

      .content {
        padding: 20px 14px 24px;
      }

      .title {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <section class="card">

      <!-- Tumhari poster image -->
      <img
        class="poster"
        src="./girl.jpg"
        alt="वीडियो पोस्टर"
      >

      <div class="content">

        <h1 class="title">
          मेरी पूरी वीडियो देखने के लिए
          <span>नीचे क्लिक करो 👇</span>
        </h1>

        <!-- Adsterra Smartlink -->
        <a
          class="button"
          href="https://www.profitableratecpmnetwork.com/d0ymdnw2m?key=8c6d44ba6090f04ccda2191624c9d5b4"
          rel="noopener noreferrer"
        >
          ▶ Click Here
        </a>

        <p class="note">
          आगे बढ़ने से पहले लिंक की सामग्री की जानकारी देखें।
        </p>

      </div>

    </section>

  </main>

</body>
</html>
