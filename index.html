<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>खास वीडियो</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #0d0d16;
      font-family: Arial, sans-serif;
      color: #fff;
      padding: 12px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
    }

    .card {
      background: #181824;
      border-radius: 18px;
      overflow: hidden;
    }

    /* Image ko crop nahi karega */
    .poster {
      display: block;
      width: 100%;
      height: auto;
      max-width: 100%;
    }

    .content {
      padding: 24px 18px 28px;
      text-align: center;
    }

    .title {
      font-size: 24px;
      line-height: 1.45;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .title span {
      display: block;
      color: #ff65a9;
      margin-top: 5px;
    }

    .button {
      display: block;
      width: 100%;
      padding: 16px 20px;
      border-radius: 50px;
      background: #ed2b86;
      color: #fff;
      text-decoration: none;
      font-size: 17px;
      font-weight: 700;
    }

    .button:active {
      transform: scale(.98);
    }

    .small {
      margin-top: 15px;
      color: #aaa;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <main class="container">

    <section class="card">

      <!-- GitHub repository me image ka naam exactly girl.jpg rakho -->
      <img
        class="poster"
        src="./girl.jpg"
        alt="वीडियो पोस्टर"
      >

      <div class="content">

        <h1 class="title">
          खास वीडियो देखने के लिए
          <span>नीचे क्लिक करें 👇</span>
        </h1>

        <!-- Apna genuine destination link yahan rakho -->
        <a
          class="button"
          href="https://www.profitableratecpmnetwork.com/inbfnexb4?key=46e9ed39c1b72d9f0a79b10cd80cdd34"
          rel="noopener noreferrer"
        >
          वीडियो देखें →
        </a>

        <p class="small">
          आगे बढ़ने से पहले लिंक की सामग्री की जानकारी देखें।
        </p>

      </div>

    </section>

  </main>

</body>
</html>
