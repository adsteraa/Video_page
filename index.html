<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Watch New Video</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#111;
  font-family:Arial,sans-serif;
}

.container{
  width:94%;
  max-width:500px;
  text-align:center;
}

.card{
  background:#fff;
  padding:12px;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,.35);
}

.girl{
  width:100%;
  height:auto;
  display:block;
  border-radius:15px;
}

.title{
  font-size:25px;
  font-weight:700;
  margin:18px 0 12px;
  color:#222;
}

.button{
  display:block;
  padding:16px;
  background:#e91e63;
  color:#fff;
  text-decoration:none;
  border-radius:50px;
  font-size:18px;
  font-weight:bold;
}

.note{
  font-size:12px;
  color:#777;
  margin-top:12px;
}
</style>
</head>

<body>

<div class="container">
  <div class="card">

    <!-- Upar banayi hui girl image -->
    <img
      class="girl"
      src="promo.png"
      alt="Watch New Video"
    >

    <div class="title">
      Watch New Video
    </div>

    <a
      class="button"
      href="https://cowardrainbowactual.com/xmmi0epn5?key=ba4fa4b1d8d3ea8c2c68249a178f54ee"
      target="_blank"
      rel="noopener noreferrer"
    >
      WATCH NEW VIDEO
    </a>

    <div class="note">
      Tap the button to continue.
    </div>

  </div>
</div>

</body>
</html>
